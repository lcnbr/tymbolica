[package]
name = "symbolica"
version = "2.2.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
default = []
# `symbolica-integrate` requests this native allocator feature. Keep the feature
# name available while using Rust's Wasm allocator instead of mimalloc C objects.
faster_alloc = []
wasm = ["symbolica-upstream/wasm"]

[dependencies]
symbolica-upstream = { package = "symbolica", git = "https://github.com/symbolica-dev/symbolica", rev = "680f51f5b70c0ad00a2cc7745206b3c7de9af2c1", default-features = false, features = ["wasm"] }
